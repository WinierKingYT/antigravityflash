name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Production Module Syntax Validation
        run: |
          python -m compileall -q src

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Package Import Verification
        run: |
          python -c "import strict_engineering; print(f'Installed version: {strict_engineering.__version__}')"

      - name: Run Full Test Suite
        run: |
          python run_tests.py
