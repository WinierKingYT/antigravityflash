[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-strict-engineering"
version = "1.2.4"
description = "Deterministic, Risk-Adaptive and Adversarial Reliability Kernel for Google Antigravity"
readme = "README.md"
authors = [{ name = "Strict Engineering Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
strict-engineering = "strict_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

